<text x="44" y="654" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#806229">NEXT VALIDATION GATE</text>
<text x="44" y="690" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17343d">Unfamiliar implementations</text>
<text x="44" y="721" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Reserve before tuning. Pin the evaluator.</text>
<text x="44" y="750" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Human adjudication; declared coverage.</text>
<text x="44" y="790" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#806229">Then: a creator pilot</text>
<rect x="24" y="852" width="392" height="120" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="44" y="881" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#4e6570">REPORT WITH DENOMINATORS</text>
<text x="44" y="915" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17343d">Label agreement · false pass / fail</text>
<text x="44" y="945" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17343d">Repeat agreement · missing / invalid</text>
