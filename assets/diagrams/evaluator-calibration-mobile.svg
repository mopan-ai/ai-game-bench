<svg xmlns="http://www.w3.org/2000/svg" width="440" height="996" viewBox="0 0 440 996" role="img" aria-labelledby="title desc">
<title id="title">Calibrate before you compare</title>
<desc id="desc">Development loop: working and faulty fixtures, a label-blind evaluator, reference and evidence audit, then a versioned change and regression rerun. Held-out validation and human adjudication on unfamiliar implementations are separate next gates, not completed claims.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#748c94" stroke-width="1.4"/></marker></defs>
<rect width="440" height="996" rx="16" fill="white"/>
<rect x="0.75" y="0.75" width="438.5" height="994.5" rx="16" fill="none" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">02 / EVALUATOR VALIDATION</text>
<text x="24" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17343d">Calibrate before</text>
<text x="24" y="112" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17343d">you compare</text>
<text x="24" y="145" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4e6570">Test the judge, then the creator.</text>
<text x="24" y="185" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#4e6570">DEVELOPMENT / KNOWN CASES</text>
