<path d="M608 458 H654" fill="none" stroke="#748c94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<rect x="668" y="144" width="260" height="410" rx="12" fill="#fcf8ee" stroke="#c3a15e" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="688" y="174" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#806229">NEXT VALIDATION GATE</text>
<text x="688" y="230" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17343d">Unfamiliar</text>
<text x="688" y="265" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17343d">implementations</text>
<text x="688" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Reserved before tuning</text>
<path d="M688 335 H908" fill="none" stroke="#e6d8b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="372" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#17343d">Fixed evaluator</text>
<text x="688" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#17343d">Human adjudication</text>
<text x="688" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#17343d">Declared coverage</text>
<text x="688" y="507" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#806229">Then: a creator pilot</text>
<rect x="32" y="586" width="896" height="90" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="52" y="613" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#4e6570">REPORT WITH DENOMINATORS</text>
<text x="52" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17343d">Label agreement</text>
<text x="274" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17343d">False pass / fail</text>
<text x="496" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17343d">Repeat agreement</text>
<text x="724" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#17343d">Missing / invalid</text>
</svg>
