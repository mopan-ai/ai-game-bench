<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc">
<title id="title">Calibrate before you compare</title>
<desc id="desc">Development loop: working and faulty fixtures, a label-blind evaluator, reference and evidence audit, then a versioned change and regression rerun. Held-out validation and human adjudication on unfamiliar implementations are separate next gates, not completed claims.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#748c94" stroke-width="1.4"/></marker></defs>
<rect width="960" height="704" rx="16" fill="white"/>
<rect x="0.75" y="0.75" width="958.5" height="702.5" rx="16" fill="none" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="32" y="37" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">02 / EVALUATOR VALIDATION</text>
<text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17343d">Calibrate before you compare</text>
<text x="32" y="111" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4e6570">Test the judge, then test the creator.</text>
<rect x="24" y="144" width="604" height="410" rx="12" fill="#f7fafb" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="44" y="174" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#4e6570">DEVELOPMENT / KNOWN CASES</text>
<rect x="44" y="198" width="240" height="140" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="62" y="225" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">01</text>
<text x="62" y="260" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17343d">Working + faulty</text>
<text x="62" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">One behavior at a time</text>
<text x="62" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Labels kept from judge</text>
<rect x="368" y="198" width="240" height="140" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="386" y="225" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">02</text>
<text x="386" y="260" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17343d">Blind playtest</text>
<text x="386" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Screenshot → action</text>
<text x="386" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Frozen configuration</text>
<rect x="368" y="388" width="240" height="140" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="386" y="415" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">03</text>
<text x="386" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17343d">Audit the verdict</text>
<text x="386" y="483" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Reference agreement</text>
<text x="386" y="508" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Evidence support</text>
<rect x="44" y="388" width="240" height="140" rx="12" fill="white" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="62" y="415" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">04</text>
<text x="62" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17343d">Version the change</text>
<text x="62" y="483" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Keep prior decisions</text>
<text x="62" y="508" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Rerun regression cases</text>
