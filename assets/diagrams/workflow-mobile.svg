  <text x="32" y="979" font-size="26" font-weight="700" fill="var(--text)">Evidence review</text>
  <text x="32" y="1010" font-size="20" font-weight="400" fill="var(--muted)">Inspect claims · record limitations</text>
  <path class="arrow" d="M220 1036 V1056" marker-end="url(#arrowhead)"/>
  <rect x="12" y="1066" width="416" height="102" rx="12" fill="var(--report)" stroke="var(--report)"/>
  <text x="32" y="1092" font-size="14" font-weight="700" fill="var(--report-muted)">CURATED PUBLICATION</text>
  <text x="32" y="1125" font-size="26" font-weight="700" fill="var(--report-text)">Reports &amp; comparisons</text>
  <text x="32" y="1154" font-size="20" font-weight="400" fill="var(--report-muted)">aigamebench.com</text>
</svg>
