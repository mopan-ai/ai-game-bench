<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1098" viewBox="0 0 1280 1098" role="img" aria-labelledby="title desc">
<title id="title">AI Game Bench: system overview and contribution points</title>
<desc id="desc">System and contribution map. Task authors define a versioned suite; platform integrators describe the creator system. A contributor records each fresh trial and its game artifact, observable trajectory and resources. Evaluators grade the game separately and test their graders against reference cases. A public evidence export combines both trajectories and criterion results for maintainer review. Publication is a separate curated operation. Harbor runs native calibration; browser pilots use guides. Creator adapters and held-out evaluator validation remain next work.</desc>
