<path d="M480 476 V518" fill="none" stroke="#748c94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M798 476 V518" fill="none" stroke="#748c94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="532" width="896" height="122" rx="12" fill="#f7f9fa" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="54" y="569" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17343d">Evidence &amp; maintainer review</text>
<text x="54" y="600" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4e6570">Criteria · trajectories · time / cost · limitations</text>
<text x="54" y="629" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Declare what was checked: structure, evidence, artifact replay, generation rerun.</text>
<text x="32" y="692" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#4e6570">PROTOCOL OVERVIEW</text>
<text x="230" y="692" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4e6570">Automation varies by track. Publication is a separate decision.</text>
