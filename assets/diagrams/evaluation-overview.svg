<text x="52" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17343d">Creator system</text>
<text x="52" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Model · harness · tools</text>
<text x="52" y="393" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Prompt → delivered game</text>
<path d="M52 415 H272" fill="none" stroke="#d5e1e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="449" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#355cb4">creation.jsonl</text>
<rect x="350" y="262" width="260" height="214" rx="12" fill="#f0f9f5" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="370" y="293" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">02 HANDOFF</text>
<text x="370" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17343d">Playable artifact</text>
<text x="370" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">URL or local bundle</text>
<text x="370" y="393" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Pinned build identity</text>
<path d="M370 415 H590" fill="none" stroke="#d5e1e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="370" y="449" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#147d68">No creation commentary</text>
<rect x="668" y="262" width="260" height="214" rx="12" fill="#f0f9f5" stroke="#d5e1e4" stroke-width="1.5"/>
