<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-labelledby="title desc">
<title id="title">From task to evidence</title>
<desc id="desc">One versioned task and policy govern creation. The playable build is handed to separate gameplay evaluation; creation context is reserved for diagnosis and evidence review. Automation varies by track.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#748c94" stroke-width="1.4"/></marker></defs>
<rect width="960" height="724" rx="16" fill="white"/>
<rect x="0.75" y="0.75" width="958.5" height="722.5" rx="16" fill="none" stroke="#d5e1e4" stroke-width="1.5"/>
<text x="32" y="37" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#147d68">01 / EVALUATION DESIGN</text>
<text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#17343d">From task to evidence</text>
<text x="32" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4e6570">One creation trial. A separate evaluation of the game.</text>
<rect x="32" y="134" width="896" height="88" rx="12" fill="#17343d" stroke="#17343d" stroke-width="1.5"/>
<text x="54" y="161" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" fill="#8ddbc7">FROZEN BEFORE EXECUTION</text>
<text x="54" y="197" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="white">Task + rubric</text>
<text x="350" y="197" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="white">System + configuration</text>
<text x="668" y="197" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="white">Policy + budget</text>
<path d="M162 222 V250" fill="none" stroke="#748c94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M798 222 V250" fill="none" stroke="#748c94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="262" width="260" height="214" rx="12" fill="#f3f6ff" stroke="#d5e1e4" stroke-width="1.5"/>
