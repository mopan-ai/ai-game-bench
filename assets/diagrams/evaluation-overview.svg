<text x="688" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17343d">Gameplay evaluation</text>
<text x="688" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Actions → observations</text>
<text x="688" y="393" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4e6570">Criterion-level decisions</text>
<path d="M688 415 H908" fill="none" stroke="#d5e1e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="449" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#147d68">evaluation.jsonl</text>
